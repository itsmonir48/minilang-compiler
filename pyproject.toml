[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minilang"
version = "0.1.0"
description = "MiniLang compiler and parser workbench (CIT 412 Compiler Design lab)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ply==3.11"]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
minilang = "minilang.cli:main"

[tool.setuptools.packages.find]
include = ["minilang*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
