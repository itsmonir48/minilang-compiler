[theme]
base = "light"
primaryColor = "#2b5fb3"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6fa"
textColor = "#1c2333"
linkColor = "#2b5fb3"
borderColor = "#e2e7ef"
showWidgetBorder = true
baseRadius = "0.5rem"
headingFontWeights = [700, 650, 600, 600, 600, 600]
codeBackgroundColor = "#f4f6fa"
dataframeHeaderBackgroundColor = "#eef2f8"

[theme.sidebar]
backgroundColor = "#0f1f3d"
secondaryBackgroundColor = "#1a2d52"
textColor = "#d5deeb"
primaryColor = "#8cb4ff"
borderColor = "#24385f"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
